<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>INKRMN</title>
  <meta name="description" content="INKRMN. Unpredictable, texture-heavy pop for fans of genre-blurring sound design.">
  <meta name="theme-color" content="#010103">
  <!-- Set before anything is drawn, so nothing meant for the live version
       flashes up first (the main script loads later). -->
  <script>document.documentElement.classList.add('js');</script>
  <link rel="stylesheet" href="/css/site.css">
</head>
<body>


<!-- The GEO_SC logo, fixed behind the page -->
<div class="geo-hero">
  <picture>
    <source media="(orientation: portrait)" srcset="/geo-sc/scenes/ink-mn-homepage/still-tall.jpg" width="1080" height="1920">
    <img src="/geo-sc/scenes/ink-mn-homepage/still-wide.jpg" alt="" width="1920" height="1080">
  </picture>
  <canvas aria-hidden="true"></canvas>
</div>


<main>
  <section class="screen screen--boot" id="boot">
    <div class="screen__inner">
      <h1 class="visually-hidden">INKRMN</h1>
      <div class="boot__after">
      <p class="boot__signup">
        <a class="button button--geo" href="/join/">
          <span class="button__label">Join mailing list</span>
          <canvas aria-hidden="true" data-scene="/scenes/join-button/"></canvas>
        </a>
      </p>
      </div>
    </div>
  </section>
</main>

<script type="module" src="/js/site.js"></script>
</body>
</html>
